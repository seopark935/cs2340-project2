{% extends "base.html" %}

{% block content %}
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0">Jobs Map</h2>
    <a href="{% url 'jobs.list' %}" class="btn btn-outline-secondary btn-sm">Back to Jobs</a>
  </div>

  <div class="mb-3">
    <label for="radiusSlider" class="form-label">Search Radius: <span id="radiusValue"></span> miles</label>
    <input type="range" class="form-range" id="radiusSlider" min="5" max="100" step="5">
  </div>

  <style>
    #map { height: 70vh; width: 100%; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  {% if user_is_jobseeker %}
  <label style="font-size: 16px; display:flex; gap:6px; align-items:center; margin-bottom:10px;">
    <input type="checkbox" id="radiusToggle" checked>
    Only show jobs within my preferred radius
</label>
{% endif %}

  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    (function() {
      const jobs = {{ jobs_json|safe }};
      const appliedIds = {{ applied_ids|safe }};
      const isAuth = {{ user_is_authenticated|yesno:"true,false" }};
      const isJobSeeker = {{ user_is_jobseeker|yesno:"true,false" }};
      const DEFAULT_LAT = 39.5;    
      const DEFAULT_LNG = -98.35;
      const DEFAULT_ZOOM = 4;
      const USER_LOCATION_ZOOM = 12;
      const userRadius = {{ user_radius|default:0 }};
      const radiusToggle = document.getElementById("radiusToggle");
      let userLat = null; 
      let userLng = null;
      let userLocationCircle = null;

      //all radius stuff
      const radiusSlider = document.getElementById("radiusSlider");
      const radiusValueSpan = document.getElementById("radiusValue");

      radiusSlider.value = userRadius;
      radiusValueSpan.textContent = userRadius;

      let currentRadius = userRadius;

      const map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

      const markers = [];
      for (const job of jobs) {
        const isApplied = appliedIds.includes(job.id);
        const action = isAuth
          ? (isJobSeeker
              ? (isApplied
                ? '<button class="btn btn-secondary btn-sm" disabled>Pending</button>'
                : `<button class="btn btn-success btn-sm js-apply-btn" data-job-id="${job.id}" data-title="${job.title}">Apply</button>`)
              : '<div class="text-muted small">Log in as Job Seeker to apply</div>')
          : '<div class="text-muted small">Log in to apply</div>';

        const popup = `
          <div>
            <strong>${job.title}</strong><br/>
            <span class="text-muted">${job.location} • ${job.remote_type}${job.visa ? ' • Visa Sponsorship' : ''}${(job.salary_min||job.salary_max) ? ` • $${job.salary_min||'?'}-${job.salary_max||'?'}` : ''}</span>
            <div class="small mt-1">Skills: ${job.skills && job.skills.length ? job.skills.join(', ') : '(none)'}</div>
            <div class="mt-2 small">${(job.description||'').slice(0, 180)}${(job.description||'').length > 180 ? '…' : ''}</div>
            <div class="mt-2">${action}</div>
          </div>`;
          
        const m = L.marker([job.lat, job.lng]).bindPopup(popup);
        markers.push(m);
      }
     
      // ===============================

      // Compute distance helper
      function haversine(lat1, lon1, lat2, lon2) {
        const R = 3958.8; // miles
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1 * Math.PI / 180) *
          Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function handleMapCenter(lat, lng, zoom, isLiveLocation = false) {
          userLat = lat;
          userLng = lng;
          
          map.setView([userLat, userLng], 10);
          map.invalidateSize();
          
          if (isLiveLocation) {
              L.marker([userLat, userLng]).addTo(map)
                  .bindPopup("Your Current Location")
                  .openPopup();
          }

          updateRadiusFilter(currentRadius);
      }

      function reloadMapView() {
        // Collect markers currently visible on the map
        const visible = markers.filter(m => map.hasLayer(m));

        if (visible.length > 0) {
            const group = L.featureGroup(visible);
            map.fitBounds(group.getBounds().pad(0.2));
        } else if (userLat !== null) {
            map.setView([userLat, userLng], USER_LOCATION_ZOOM);
        } else {
            // fallback view
            map.setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);
        }
      }

     function updateRadiusFilter(newRadius = currentRadius) {
        const enabled = isJobSeeker && radiusToggle && radiusToggle.checked;
        
        if (userLocationCircle) {
            map.removeLayer(userLocationCircle);
            userLocationCircle = null;
        }

        markers.forEach((marker, i) => {  
          const job = jobs[i];

          if (!enabled || userLat === null || userLng === null) {
            marker.addTo(map);
            return;
          }

          const dist = haversine(userLat, userLng, job.lat, job.lng);

          if (dist <= newRadius) {
            marker.addTo(map);
          } else {
            map.removeLayer(marker);
          }
        }); 
        
        if (enabled && userLat !== null && userLng !== null && userRadius > 0) {
             const radiusMeters = newRadius * 1609.34;
             userLocationCircle = L.circle([userLat, userLng], {
                color: 'blue',
                fillColor: '#30f',
                fillOpacity: 0.1,
                radius: radiusMeters 
            }).addTo(map);

             map.fitBounds(userLocationCircle.getBounds(), {
                padding: [50, 50]
                
          });
        } else {
            reloadMapView(); 
        }
  
       
        
        if (!enabled || newRadius === 0) {
            if (userLocationCircle) {
                map.removeLayer(userLocationCircle);
                userLocationCircle = null;
            }
        }
      }

    
      if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
              (position) => {
                  handleMapCenter(position.coords.latitude, position.coords.longitude, USER_LOCATION_ZOOM, true);
              },
              (error) => {
                  // ERROR: Location denied/failed
                  console.warn("Geolocation failed. Error:", error.message);
                  handleMapCenter(DEFAULT_LAT, DEFAULT_LNG, DEFAULT_ZOOM, false);
              },
              { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
      } else {
          console.warn("Geolocation not supported. Using default view.");
          handleMapCenter(DEFAULT_LAT, DEFAULT_LNG, DEFAULT_ZOOM, false);
      }

      // Re-filter when checkbox changes
      radiusToggle.addEventListener("change", () => {
        updateRadiusFilter();
      });

      radiusSlider.addEventListener("input", (e) => {
          currentRadius = Number(e.target.value);
          radiusValueSpan.textContent = currentRadius;
          updateRadiusFilter(currentRadius); 
      });

      // Delegate apply button clicks to open modal
      document.addEventListener('click', function(e) {
        const btn = e.target.closest('.js-apply-btn');
        if (!btn) return;
        const jobId = btn.getAttribute('data-job-id');
        const title = btn.getAttribute('data-title');
        const modalEl = document.getElementById('applyModal');
        modalEl.querySelector('.modal-title').textContent = 'Apply for ' + title;
        const form = modalEl.querySelector('form');
        form.setAttribute('action', `{% url 'apply_job' 0 %}`.replace('/0/', '/' + jobId + '/'));
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      });
    })();
  </script>

  <!-- Shared Apply Modal -->
  {% if user_is_authenticated and user_is_jobseeker %}
  <div class="modal fade" id="applyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Apply</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form method="POST" action="#">
            {% csrf_token %}
            <div class="mb-3">
              <label for="messageMap" class="form-label">Message to Employer</label>
              <textarea class="form-control" id="messageMap" name="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Application</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  {% endif %}
</div>
{% endblock %}
